[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taller-canamo"
version = "0.9.1"
description = "Aplicacion local de taller. Handoff de desarrollo, no version fiscal de produccion."
requires-python = ">=3.11"
dependencies = [
  "Pillow==12.3.0", "cryptography==50.0.1", "reportlab==4.4.9",
  "lxml==6.1.1", "tzdata==2026.2", "saxonche==12.10.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pypdf==6.19.0"]
desktop = ["pyinstaller==6.22.3"]
assistant = ["vosk==0.3.45", "rapidocr==3.9.2", "onnxruntime==1.30.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
taller = ["schemas/aeat_1_0/*", "schemas/b2b_ubl21/**/*", "access_runtime/**/*", "assistant_models/**/*", "fonts/*", "legal/**/*", "release-policy.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
