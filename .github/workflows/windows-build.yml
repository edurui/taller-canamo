name: Build and verify Windows development installer (manual)
on:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: 'Candidato Windows para ensayos; no habilita producción'
        required: true
        default: false
        type: boolean
      build_run_id:
        description: 'Opcional: reutilizar este build completo; omite toda recompilación'
        required: false
        type: string
      build_source_sha:
        description: 'Commit exacto del build reutilizado (obligatorio si se indica build_run_id)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  verify-preserved:
    if: inputs.build_run_id != '' || inputs.build_source_sha != ''
    uses: ./.github/workflows/windows-verify-installer.yml
    with:
      build_run_id: ${{ inputs.build_run_id }}
      build_source_sha: ${{ inputs.build_source_sha }}
  build:
    if: inputs.build_run_id == '' && inputs.build_source_sha == ''
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      # Action revisions resolved from the official repositories on 2026-09-23.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
          cache: npm
      # Temurin's four-part security release is not a SemVer accepted by
      # setup-java. Install the exact official archive, without downgrading.
      - name: Install build JDK from verified archive
        shell: pwsh
        run: |
          $canamoAccessLock = Get-Content tools/access/dependencies.lock.json -Raw | ConvertFrom-Json
          $canamoJdkArchive = Join-Path $env:RUNNER_TEMP 'canamo-build-jdk.zip'
          $canamoJdkFolder = Join-Path $env:RUNNER_TEMP 'canamo-build-jdk'
          Invoke-WebRequest -Uri $canamoAccessLock.build_jdk.windows.url -OutFile $canamoJdkArchive
          $canamoJdkHash = (Get-FileHash $canamoJdkArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($canamoJdkHash -ne $canamoAccessLock.build_jdk.windows.sha256) { throw 'El JDK no coincide con el hash fijado.' }
          Expand-Archive -LiteralPath $canamoJdkArchive -DestinationPath $canamoJdkFolder
          $canamoJdkRoots = @(Get-ChildItem -LiteralPath $canamoJdkFolder -Directory)
          if ($canamoJdkRoots.Count -ne 1) { throw 'Estructura inesperada del JDK.' }
          "JAVA_HOME=$($canamoJdkRoots[0].FullName)" >> $env:GITHUB_ENV
          "$($canamoJdkRoots[0].FullName)\bin" >> $env:GITHUB_PATH
          & (Join-Path $canamoJdkRoots[0].FullName 'bin/javac.exe') -version
          if ($LASTEXITCODE -ne 0) { throw 'No se puede ejecutar el compilador Java.' }
      - name: Python dependencies verified by hashes
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock
      - name: Frontend dependencies from lock
        run: npm ci
      - name: Browser used only by tests
        run: npx playwright install chromium
      - name: Install pinned Rust MSVC toolchain
        working-directory: src-tauri
        run: rustup show active-toolchain
      - name: Prepare Microsoft WebDriver before the full build
        shell: pwsh
        run: ./src-tauri/tests/prepare-webdriver.ps1
      - name: Check Windows regressions before the full build
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe scripts/prepare_access_runtime.py
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo preparar el lector Access.' }
          .\.venv\Scripts\python.exe -m pytest --maxfail=1 --junitxml=reports/windows-preflight.xml tests/test_source_checkout.py tests/test_access_staging.py tests/test_stdio_lifecycle.py::test_protocol_preserves_unicode_with_a_legacy_console tests/test_access_forensics.py::test_real_jackcess_fixture_is_unchanged_and_public_summary_has_no_rows tests/test_release_candidate.py::test_copy_preserves_results_and_only_referenced_evidence
          if ($LASTEXITCODE -ne 0) { throw 'La regresión Windows sigue fallando; no se inicia el build completo.' }
      - name: Check browser regressions before the full suite
        shell: pwsh
        run: |
          foreach ($canamoPrepareScript in @('scripts/prepare_assistant_models.py', 'scripts/prepare_licenses.py')) {
            & .\.venv\Scripts\python.exe $canamoPrepareScript
            if ($LASTEXITCODE -ne 0) { throw "Falló $canamoPrepareScript" }
          }
          npm run typecheck:e2e
          if ($LASTEXITCODE -ne 0) { throw 'Falló typecheck E2E.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Falló el build de interfaz.' }
          npx playwright test --grep 'buscar matrícula conserva los kilómetros|Clientes accesible con tabla conservada: dark|cabecera visible al desplazar|orden de líneas: teclado|proveedor y catálogo|presupuesto → orden → factura conserva|menús y cabeceras accesibles sin desbordamiento|flechas y Enter aplican todos los campos|un ratón inmóvil bajo el desplegable|el buscador conserva la primera coincidencia' --max-failures=1
          if ($LASTEXITCODE -ne 0) { throw 'La regresión de navegador sigue fallando; no se inicia la batería completa.' }
          Copy-Item reports/e2e/results.json reports/windows-e2e-preflight.json
          $canamoBrowserPreflight = Get-Content reports/windows-e2e-preflight.json -Raw | ConvertFrom-Json
          if ($canamoBrowserPreflight.stats.expected -ne 13 -or $canamoBrowserPreflight.stats.unexpected -ne 0 -or $canamoBrowserPreflight.stats.skipped -ne 0 -or $canamoBrowserPreflight.stats.flaky -ne 0) { throw 'La comprobación inicial no ejecutó los trece casos completos.' }
      - name: Test and build selected installer
        shell: pwsh
        run: |
          $canamoBuildArguments = @('scripts/build_desktop.py')
          if ('${{ inputs.release_candidate }}' -eq 'true') { $canamoBuildArguments += '--release-candidate' }
          & .\.venv\Scripts\python.exe @canamoBuildArguments
      - name: Install under a user path and verify bundled service
        shell: pwsh
        run: |
          ./src-tauri/tests/verify-installed.ps1 -KeepInstalled -Manifest reports/windows-artifacts.json
          $installed = Get-Content reports/windows-installed-sidecar.json -Raw | ConvertFrom-Json
          $app = @($installed.artifacts | Where-Object { (Split-Path $_.path -Leaf) -eq 'taller-canamo.exe' })
          if ($app.Count -ne 1) { throw 'Falta la aplicación instalada.' }
          "CANAMO_TEST_INSTALLED_APP=$($app[0].path)" >> $env:GITHUB_ENV
      - name: Tauri UI with WebView2 and packaged service in the disposable runner account
        shell: pwsh
        run: .\.venv\Scripts\python.exe src-tauri/tests/desktop_smoke.py --application "$env:CANAMO_TEST_INSTALLED_APP" --native-driver ./edge-driver/msedgedriver.exe --isolated-windows-account --attach-edge
      - name: Remove only the disposable test installation
        if: always()
        shell: pwsh
        run: |
          if ($env:CANAMO_TEST_INSTALLED_APP) {
            $root = Split-Path $env:CANAMO_TEST_INSTALLED_APP
            Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith($root + '\', [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            $uninstaller = Join-Path $root 'uninstall.exe'
            if (Test-Path $uninstaller) { Start-Process $uninstaller -ArgumentList '/S' -Wait }
          }
      - name: Store installer and verification evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: taller-canamo-windows-${{ inputs.release_candidate && 'candidate' || 'development' }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            reports/windows-*.json
            reports/windows-*.xml
            reports/sidecar-functional*
            reports/e2e/
            reports/desktop/
            reports/quality/
            LEEME.md
            docs/IMPORTACION-ACCESS.md
            docs/BUILD-WINDOWS.md
          if-no-files-found: error
          retention-days: 14
